<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--background,#fff);color:var(--foreground,#181713);font-family:var(--font-sans,system-ui,sans-serif)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:16px;max-width:570px;margin:auto}

.card p,.card h2{margin:0}
.content{width:100%;align-self:center;display:flex;flex-direction:column;align-items:center;gap:4cqw}
.brand{font-size:5.8cqw;font-weight:900;letter-spacing:-.045em}
.score{font-size:28cqw;font-weight:950;letter-spacing:-.105em;line-height:.87;margin:6cqw 0 2cqw;white-space:nowrap}
.score span{font-size:11cqw;letter-spacing:-.09em;padding-left:1cqw}
.label{font-size:10cqw;letter-spacing:-.09em;font-weight:900}
.subtitle{font-size:5.7cqw;font-weight:670;letter-spacing:-.045em}
.invite{border:1px solid var(--ink);box-shadow:2px 2px var(--ink);border-radius:100px;padding:2.6cqw 4.6cqw;background:#fff8e8;font-size:5.5cqw;font-weight:850;letter-spacing:-.05em;margin-top:3cqw!important}
.photo{display:block;width:93%;aspect-ratio:1;object-fit:cover;border:1px solid var(--ink);border-radius:8px;transform:rotate(-5deg);box-shadow:4px 4px var(--ink);margin:2cqw 0}
.tile{position:absolute;background:#f7d353;border:1px solid var(--ink);width:19%;aspect-ratio:1;border-radius:22%;display:grid;place-items:center;font-size:10cqw;transform:rotate(15deg);right:9%;top:11%;z-index:-1}
.spark{position:absolute;font-size:16cqw;bottom:7%;left:9%;color:#7552c2;transform:rotate(-16deg)}
</style>
