<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 밈 월드컵 · PC 홈 시안</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
* { box-sizing: border-box }
body { margin:0; color:var(--foreground,#181713); background:var(--background,#fff); font-family:var(--font-sans,system-ui,sans-serif) }
button { font:inherit }
.mockup { --paper:#faf6eb; --ink:#1a1914; --orange:#ff673c; --line:#26231c; --sub:#625b4f;
  position:relative; margin:0 auto; overflow:hidden; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif; border:1px solid #d5cfc3; border-radius:16px }
.mockup button { cursor:pointer }
.mockup button:focus-visible,.cards:focus-visible { outline:3px solid #4b39ca; outline-offset:3px }
.header { display:flex; align-items:center; gap:9px; border-bottom:1px solid #ddd5c6; height:56px; padding-inline:var(--gutter); font-size:14px; font-weight:900; letter-spacing:-.045em }
.mark { width:23px; aspect-ratio:1; display:grid; place-items:center; border:1.5px solid var(--line); border-radius:7px; background:var(--orange); transform:rotate(-8deg) }
.mark svg { width:14px; height:14px }
.hero { position:relative; display:grid; align-items:center; grid-template-columns:minmax(0,1fr) auto; padding:31px var(--gutter) 28px }
h1,h2,p,ul { margin:0 }
.year { display:block; font:400 clamp(55px, 11vw, 101px)/.91 "Archivo Black","Arial Black",sans-serif; letter-spacing:-.085em; margin-left:-.05em }
h1 { font-size:clamp(44px,8vw,73px); line-height:1.11; font-weight:900; letter-spacing:-.09em }
.hero p { color:var(--sub); margin-top:11px; font-size:15px; font-weight:600; letter-spacing:-.035em }
.art { isolation:isolate; position:relative; margin:0 3.7vw 2px 0; width:clamp(118px,20vw,213px); aspect-ratio:1; display:grid; place-items:center }
.art::before,.art::after { content:""; position:absolute; inset:12%; z-index:-1; border:2px solid var(--line); border-radius:17%; transform:rotate(-16deg); background:#ded3ff }
.art::after { transform:rotate(13deg); inset:14%; background:#f8d84c }
.art b { font-size:clamp(39px,6.7vw,76px); font-weight:900; letter-spacing:-.15em; transform:translate(-.07em,-.04em) rotate(13deg) }
.art svg { position:absolute; width:24%; color:var(--orange); right:-1%; top:0%; transform:rotate(7deg); filter:drop-shadow(1px 1px 0 var(--line)) }
.shelf-top { margin:0 var(--gutter) 9px; padding-top:11px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:8px }
h2 { font-size:18px; font-weight:900; line-height:1.2; letter-spacing:-.055em }
.nav { display:flex; align-items:center; gap:6px }
.nav button { width:36px; height:36px; border:1px solid var(--line); border-radius:50%; background:var(--paper); color:var(--ink); font-size:19px; line-height:1; display:grid; place-items:center; padding:0 }
.nav button:hover:enabled { background:var(--ink); color:var(--paper) }
.nav button:disabled { opacity:.35; cursor:default }
.cards { display:grid; grid-auto-flow:column; grid-auto-columns:calc((100% - 64px) / 3.18); gap:13px; padding:0 var(--gutter); overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding-inline:var(--gutter); scrollbar-width:none; list-style:none }
.cards::-webkit-scrollbar { display:none }
.meme { align-self:start; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fffaf0; scroll-snap-align:start }
.meme img { display:block; width:100%; height:auto; aspect-ratio:1.47; object-fit:cover; object-position:center 43%; border-bottom:1px solid var(--line) }
.card-copy { padding:10px 11px 11px; min-height:64px }
.card-copy strong { display:block; font-size:16px; line-height:1.25; font-weight:900; letter-spacing:-.055em }
.card-copy p { margin-top:5px; font-size:12px; line-height:1.4; letter-spacing:-.04em; color:var(--sub) }
.dots { display:none }
.actions { padding:19px var(--gutter) 23px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px }
.action { display:grid; grid-template-columns:21px 1fr 20px; align-items:center; gap:9px; text-align:left; min-height:53px; padding:7px 13px; background:var(--orange); color:var(--ink); border:1.5px solid var(--line); border-radius:9px; box-shadow:0 3px 0 var(--line); font-size:16px; font-weight:900; letter-spacing:-.05em }
.action svg { width:19px; height:19px }
.action span { justify-self:end; font-size:19px }
.action.secondary { background:var(--paper) }
.action:hover { filter:brightness(.95) }
.action:active { transform:translateY(2px); box-shadow:0 1px 0 var(--line) }
dialog { width:min(340px,calc(100% - 40px)); padding:22px; background:var(--paper); color:var(--ink); border:1.5px solid var(--line); border-radius:13px; box-shadow:4px 4px 0 var(--line) }
dialog::backdrop { background:#1a19146a }
dialog p { margin:9px 0 18px; color:var(--sub); font-size:14px }
dialog button { border:1px solid var(--line); border-radius:7px; padding:7px 14px; background:var(--orange); color:var(--ink); font-weight:800 }
.desktop { --gutter:clamp(19px,4.1vw,52px); max-width:1160px }
.mobile { --gutter:18px; max-width:390px }
.mobile .header { height:48px; font-size:13px }
.mobile .hero { padding-top:24px; padding-bottom:21px }
.mobile .year { font-size:69px }
.mobile h1 { font-size:48px }
.mobile .hero p { font-size:13px; margin-top:8px }
.mobile .art { width:87px; margin-right:4px }
.mobile .art b { font-size:37px }
.mobile .art::before,.mobile .art::after { border-width:1.5px }
.mobile .shelf-top { margin-bottom:10px }
.mobile h2 { font-size:16px }
.mobile .nav { display:none }
.mobile .cards { grid-auto-columns:calc(100% - 39px); gap:10px }
.mobile .meme img { aspect-ratio:1.68 }
.mobile .card-copy { min-height:0 }
.mobile .dots { display:flex; justify-content:center; gap:7px; margin:2px 0 0 }
.mobile .dot { display:grid; place-items:center; width:17px; height:22px; border:0; background:transparent; padding:0 }
.mobile .dot::after { content:""; width:6px; height:6px; background:#bcb3a1; border-radius:8px }
.mobile .dot[aria-current=true]::after { width:16px; background:var(--ink) }
.mobile .actions { grid-template-columns:1fr; gap:10px; padding-top:3px; padding-bottom:18px }
.mobile .action { min-height:45px; font-size:15px }
@media(max-width:560px) {
  .desktop .cards { grid-auto-columns:calc((100% - 28px) / 2.12) }
  .desktop .hero p { font-size:13px }
  .desktop .action { font-size:13px; padding-inline:8px; gap:6px; grid-template-columns:17px 1fr 14px }
  .desktop .action svg { width:16px; height:16px }
}
@media(max-width:350px) {
  .mobile h1 { font-size:39px }
  .mobile .year { font-size:62px }
  .mobile .art { width:64px; margin-right:0 }
  .mobile .art b { font-size:29px }
}
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important } }
</style>
</head>

    <div class="dots" aria-label="보고 싶은 밈 선택">
      <button class="dot" type="button" aria-label="1번째 밈" aria-current="true"></button><button class="dot" type="button" aria-label="2번째 밈" aria-current="false"></button><button class="dot" type="button" aria-label="3번째 밈" aria-current="false"></button><button class="dot" type="button" aria-label="4번째 밈" aria-current="false"></button>
    </div>
  </section>
  <div class="actions">
    <button class="action" type="button" data-mode="vote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 13 4 16v4h16v-4l-3-3M4 16h16M8 10l4-6 6 4-4 6z"/></svg>
      올해의 밈 투표 <span aria-hidden="true">→</span>
    </button>
    <button class="action secondary" type="button" data-mode="quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H5v15h14V5h-4M9 3h6v4H9zM8.5 13l2.5 2.5 4.5-5"/></svg>
      내가 아는 밈 테스트 <span aria-hidden="true">→</span>
    </button>
  </div>
  <dialog aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2><p></p>
    <form method="dialog"><button>홈으로</button></form>
  </dialog>
</main>
<script>
const track = document.querySelector('.cards');
const cards = [...track.children];
const dots = [...document.querySelectorAll('.dot')];
const previous = document.querySelector('#previous');
const next = document.querySelector('#next');
const offsets = () => cards.map(card => card.offsetLeft - cards[0].offsetLeft);
const limit = () => track.scrollWidth - track.clientWidth;
const behavior = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
function move(direction) {
  const positions = [0, ...offsets().filter(offset => offset > 1 && offset < limit() - 1), limit()];
  const target = direction > 0
    ? positions.find(position => position > track.scrollLeft + 2)
    : positions.findLast(position => position < track.scrollLeft - 2);
  if (target !== undefined) track.scrollTo({left:target, behavior:behavior()});
}
function update() {
  previous.disabled = track.scrollLeft <= 2;
  next.disabled = track.scrollLeft >= limit() - 2;
  const distances = offsets().map(offset => Math.abs(Math.min(offset, limit()) - track.scrollLeft));
  const active = distances.indexOf(Math.min(...distances));
  dots.forEach((dot, index) => dot.setAttribute('aria-current', String(active === index)));
}
previous.addEventListener('click', () => {
  move(-1);
  if (track.scrollLeft <= 2) track.focus({preventScroll:true});
});
next.addEventListener('click', () => move(1));
track.addEventListener('scroll', update, {passive:true});
new ResizeObserver(update).observe(track);
dots.forEach((dot, index) => dot.addEventListener('click', () =>
  track.scrollTo({left:offsets()[index], behavior:behavior()})
));
const dialog = document.querySelector('dialog');
const descriptions = {
  vote: '가장 인상 깊었거나 자주 썼던 밈에 한 표를 던져요.',
  quiz: '밈을 하나씩 보고 ‘안다’ 또는 ‘모른다’를 골라요.'
};
document.querySelectorAll('.action').forEach(button => button.addEventListener('click', () => {
  dialog.querySelector('h2').textContent = button.textContent.replace('→', '').trim();
  dialog.querySelector('p').textContent = descriptions[button.dataset.mode];
  dialog.showModal();
}));
update();
</script>
